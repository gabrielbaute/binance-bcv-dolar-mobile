name: dolarvzla
description: "An android client for DolarVzla project."
publish_to: 'none'
version: 0.3.0+13

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  cupertino_icons: ^2.0.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  go_router: ^18.0.2
  package_info_plus: ^10.2.1
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  permission_handler: ^13.0.2
  ntfy: ^1.0.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_post_build: ^1.3.0

flutter_post_builder:
  package_name: "Dolar Pulse VE"
  append_version: true
  final_directory: "./release"
  move_files: true
  discard:
    v7a: false
    a64: false
    x86: false
    uni: false
  clean_build_folder: true

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
